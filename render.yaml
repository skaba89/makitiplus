services:
  - type: web
    name: makitiplus
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
      - key: VITE_SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: VITE_SENTRY_REPLAY_SAMPLE_RATE
        value: "0.05"
      - key: VITE_DEMO_MODE
        value: "false"
      - key: VITE_APP_VERSION
        sync: false
    headers:
      # --- Security headers (applied to all routes) ---
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), geolocation=(), microphone=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://*.supabase.co https://*.sentry.io https://api.stripe.com; img-src 'self' data: blob: https:; script-src 'self' https://js.stripe.com; style-src 'self'; font-src 'self' data:; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none';"
      # --- Cache headers (specific paths) ---
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: public, max-age=3600
    routes:
      # React Router SPA fallback: direct visits to /auth, /dashboard, etc.
      # must serve index.html instead of returning Render's plain "Not Found".
      - type: rewrite
        source: /*
        destination: /index.html
