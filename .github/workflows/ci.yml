name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/ --ignore-pattern 'src/test/**' --max-warnings 10

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npx vite build

      - name: Unit tests
        run: npx vitest run --reporter=verbose
        env:
          # Provide dummy env vars so supabase client doesn't crash
          VITE_SUPABASE_URL: https://dummy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key

      - name: Validate SQL migrations
        run: python3 scripts/validate_sql_migrations.py

      - name: Check for undefined function references (AUDIT-2026-007 HIGH-4 prevention)
        run: python3 scripts/check_undefined_functions.py

      - name: Security audit (high/critical — blocks the pipeline)
        run: python3 scripts/check_npm_audit.py

      - name: Security audit (moderate — informational only)
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Check for .env leaks
        run: |
          # Check for tracked .env files (excluding .env.example)
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example'; then
            echo "ERROR: tracked .env file detected"
            exit 1
          fi

      - name: Check for secrets in code
        run: |
          # Only flag REAL secret values (not env var names in scripts/tests/CI)
          # Check for actual Stripe live secret values (sk_live_/rk_live_ with 20+ chars)
          if git grep -nE '(sk_live_|rk_live_)[A-Za-z0-9]{20,}' -- . ':!*.md' ':!docs/**' ':!scripts/**'; then
            echo "ERROR: actual Stripe live secret detected in code"
            exit 1
          fi
          # Check for Supabase service role key with actual JWT (eyJ...)
          if git grep -nE 'SUPABASE_SERVICE_ROLE_KEY.*eyJ[A-Za-z0-9+/=]{20,}' -- . ':!*.md' ':!docs/**' ':!scripts/**' ':!.env.example' ':!src/test/**' ':!supabase/functions/**'; then
            echo "ERROR: actual Supabase service role key detected in code"
            exit 1
          fi
          # Check for actual Stripe secret key with real value
          if git grep -nE 'STRIPE_SECRET_KEY.*sk_live_[A-Za-z0-9]{20,}' -- . ':!*.md' ':!docs/**' ':!scripts/**' ':!.env.example' ':!src/test/**' ':!supabase/functions/**'; then
            echo "ERROR: actual Stripe secret key detected in code"
            exit 1
          fi

  # Pilot-critical E2E — BLOCKING job for production readiness
  # Requires VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY secrets
  # If E2E_TEST_EMAIL/E2E_TEST_PASSWORD secrets are missing, login tests are skipped gracefully
  pilot-e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Pilot critical E2E
        run: npm run e2e:pilot
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      - name: Pilot E2E summary
        if: always()
        run: echo "Pilot critical E2E tests completed"

  # Full E2E tests — optional job, won't break CI if secrets are missing
  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    # Don't block the pipeline if this job fails (secrets may not be configured yet)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: E2E summary
        if: always()
        run: echo "E2E tests completed (optional — failures don't block CI)"
