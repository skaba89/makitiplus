name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/ --ignore-pattern 'src/test/**' --max-warnings 50

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      - name: Unit tests
        run: npx vitest run --reporter=verbose
        env:
          # Provide dummy env vars so supabase client doesn't crash
          VITE_SUPABASE_URL: https://dummy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key

      - name: Validate SQL migrations
        run: python3 scripts/validate_sql_migrations.py

      - name: Security audit (high/critical — blocks the pipeline)
        run: npm audit --audit-level=high

      - name: Security audit (moderate — informational only)
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Check for .env leaks
        run: |
          # Check for tracked .env files (excluding .env.example)
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example'; then
            echo "ERROR: tracked .env file detected"
            exit 1
          fi

      - name: Check for secrets in code
        run: |
          if git grep -nE '(SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|sk_live_|rk_live_)' -- . ':!*.md' ':!docs/**' ':!.env.example'; then
            echo "ERROR: potential secret detected in code"
            exit 1
          fi

  # E2E tests — optional job, won't break CI if secrets are missing
  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    # Don't block the pipeline if this job fails (secrets may not be configured yet)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: E2E summary
        if: always()
        run: echo "E2E tests completed (optional — failures don't block CI)"
