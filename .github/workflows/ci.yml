name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/ --ignore-pattern 'src/test/**' --max-warnings 50

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      - name: Unit tests
        run: npx vitest run --reporter=verbose
        env:
          # Provide dummy env vars so supabase client doesn't crash
          VITE_SUPABASE_URL: https://dummy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: dummy-key

      - name: Validate SQL migrations
        run: python3 scripts/validate_sql_migrations.py

      - name: Security audit (high/critical — blocks the pipeline)
        run: npm audit --audit-level=high

      - name: Security audit (moderate — informational only)
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Check for .env leaks
        run: |
          if git diff --cached --name-only | grep -q '\.env$'; then
            echo "ERROR: .env file detected in commit!"
            exit 1
          fi
