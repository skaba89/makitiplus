name: Generate P0 store-scope migration candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/generate-store-scope-candidate.yml'

permissions:
  contents: read

jobs:
  generate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only one immutable SQL blob is needed; avoid walking the unrelated
      # legacy gitlink with missing .gitmodules metadata.
      - name: Fetch pinned source SQL using read-only repository access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          gh api --method GET -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/supabase/migrations/20261121201546_harden_sale_write_tenant_scope.sql" \
            -f ref="$GITHUB_SHA" > "$RUNNER_TEMP/mkp-store-source.sql"
          test "$(git hash-object "$RUNNER_TEMP/mkp-store-source.sql")" = d44749a52506389217f3e465154bf30fd590b392
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Generate review-only SQL in a fresh unlinked directory
        env:
          SUPABASE_TELEMETRY_DISABLED: 'true'
        run: |
          set -euo pipefail
          umask 077
          scratch=$(mktemp -d "$RUNNER_TEMP/mkp-migration-XXXXXXXX")
          cd "$scratch"
          supabase migration --help >/dev/null
          supabase migration new --help >/dev/null
          supabase init
          supabase migration new harden_sale_product_store_scope
          shopt -s nullglob
          candidates=(supabase/migrations/*_harden_sale_product_store_scope.sql)
          test "${#candidates[@]}" -eq 1
          candidate="${candidates[0]}"
          source="$RUNNER_TEMP/mkp-store-source.sql"
          test "$(git hash-object "$source")" = d44749a52506389217f3e465154bf30fd590b392
          node --input-type=module - "$source" "$candidate" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const [source, target] = process.argv.slice(2);
          const original = readFileSync(source, 'utf8');
          const read = 'AND organization_id = p_organization_id;';
          const write = 'AND organization_id = p_organization_id AND stock_quantity >=';
          assert.equal(original.split(read).length, 2);
          assert.equal(original.split(write).length, 2);
          const candidate = original
            .replace(read, 'AND organization_id = p_organization_id AND store_id IS NOT DISTINCT FROM v_resolved_store_id;')
            .replace(write, 'AND organization_id = p_organization_id AND store_id IS NOT DISTINCT FROM v_resolved_store_id AND stock_quantity >=');
          writeFileSync(target, '-- P0 candidate: enforce product/store scope; requires staging inventory and CI validation.\n' + candidate);
          NODE
          mkdir -p "$RUNNER_TEMP/mkp-store-candidate"
          cp "$candidate" "$RUNNER_TEMP/mkp-store-candidate/"
          basename "$candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: store-scope-migration-review-only
          path: ${{ runner.temp }}/mkp-store-candidate/*.sql
          if-no-files-found: error
          retention-days: 7
