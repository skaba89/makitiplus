# Supabase project configuration
# Set project_id via: supabase link --project-ref <VOTRE_PROJECT_REF>
# Or set the SUPABASE_PROJECT_REF environment variable before running scripts
project_id = "VOTRE_PROJECT_REF"

# Stripe webhook needs verify_jwt=false because Stripe sends
# requests without a Supabase JWT (uses its own signature instead)
[functions.stripe-webhook]
verify_jwt = false

[functions.redeem-reset-token]
verify_jwt = false

[functions.rotate-test-accounts]
verify_jwt = false
